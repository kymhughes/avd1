parameters:
  stageName: ''
  environmentName: ''
  doDestroy: false
  runStage: true
  azureServiceConnection: ''
  deploymentSubscriptionId: ''
  computeResourceGroups: ''

stages:
  - stage: ${{ parameters.stageName }}
    displayName: Pre-destroy ${{ parameters.environmentName }} session host cleanup
    condition: and(succeeded(), or(eq('${{ parameters.runStage }}', 'true'), eq('${{ parameters.runStage }}', 'True')))
    jobs:
      - job: Cleanup
        displayName: Cleanup AVD-created compute
        steps:
          - bash: |
              echo "Pre-destroy cleanup enabled: ${{ parameters.doDestroy }}"
            displayName: Pre-destroy cleanup status

          - task: AzureCLI@2
            displayName: Delete AVD-created VMs, NICs, and disks
            condition: and(succeeded(), or(eq('${{ parameters.doDestroy }}', 'true'), eq('${{ parameters.doDestroy }}', 'True')))
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az account set --subscription "${{ parameters.deploymentSubscriptionId }}"

                for resource_group in ${{ parameters.computeResourceGroups }}; do
                  if ! az group show --name "${resource_group}" >/dev/null 2>&1; then
                    echo "Resource group ${resource_group} does not exist; skipping."
                    continue
                  fi

                  mapfile -t vm_ids < <(az vm list \
                    --resource-group "${resource_group}" \
                    --query "[].id" \
                    --output tsv)

                  if [ "${#vm_ids[@]}" -eq 0 ]; then
                    echo "No VMs found in ${resource_group}."
                    continue
                  fi

                  for vm_id in "${vm_ids[@]}"; do
                    echo "Deleting VM ${vm_id}"

                    mapfile -t nic_ids < <(az vm show \
                      --ids "${vm_id}" \
                      --query "networkProfile.networkInterfaces[].id" \
                      --output tsv)

                    mapfile -t disk_ids < <(az vm show \
                      --ids "${vm_id}" \
                      --query "[storageProfile.osDisk.managedDisk.id] + storageProfile.dataDisks[].managedDisk.id" \
                      --output tsv)

                    az vm delete --ids "${vm_id}" --yes

                    for nic_id in "${nic_ids[@]}"; do
                      if [ -n "${nic_id}" ]; then
                        echo "Deleting NIC ${nic_id}"
                        az network nic delete --ids "${nic_id}"
                      fi
                    done

                    for disk_id in "${disk_ids[@]}"; do
                      if [ -n "${disk_id}" ]; then
                        echo "Deleting disk ${disk_id}"
                        az disk delete --ids "${disk_id}" --yes
                      fi
                    done
                  done
                done
