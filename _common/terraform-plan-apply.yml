
parameters:
  azureServiceConnection: ''
  deploymentSubscriptionId: ''
  stateSubscriptionId: ''
  backendResourceGroupName: ''
  backendStorageAccountName: ''
  backendContainerName: 'tfstate'
  backendStateKey: ''
  environmentName: ''
  terraformWorkingDirectory: ''
  terraformCommonVarFile: ''
  terraformVarFile: ''
  terraformVersion: '1.15.8'
  doPause: false
  doDestroy: false
  env: 'npd'

stages:
  - stage: Terraform
    displayName: Terraform
    jobs:
      - job: Apply
        displayName: Terraform apply (${{ parameters.environmentName }})
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail

              terraform_version='${{ parameters.terraformVersion }}'
              terraform_dir='$(Agent.TempDirectory)/terraform'
              mkdir -p "${terraform_dir}"

              curl -fsSL \
                "https://releases.hashicorp.com/terraform/${terraform_version}/terraform_${terraform_version}_linux_amd64.zip" \
                -o "$(Agent.TempDirectory)/terraform.zip"
              unzip -o -q "$(Agent.TempDirectory)/terraform.zip" -d "${terraform_dir}"

              echo "##vso[task.prependpath]${terraform_dir}"
              "${terraform_dir}/terraform" version

              echo "Checking Routes"

              ip route get 172.17.10.6
              gateway="$(ip route show default | awk '{print $3; exit}')"
              sudo ip route replace 172.17.10.6/32 via "$gateway" dev eth0

              ip route get 172.17.100.248
              gateway="$(ip route show default | awk '{print $3; exit}')"
              sudo ip route replace 172.17.100.248/32 via "$gateway" dev eth0

              echo "done Checking Routes"


            displayName: Install Terraform

          - bash: |
              set -euo pipefail
              cd "${{parameters.terraformWorkingDirectory}}"
              terraform fmt -check -recursive

            displayName: Terraform fmt

          - task: AzureCLI@2
            displayName: Terraform init
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: 'true'
              inlineScript: |
                set -euo pipefail

                export TF_IN_AUTOMATION=true
                export TF_INPUT=false
                export ARM_SUBSCRIPTION_ID='${{ parameters.deploymentSubscriptionId }}'

                arm_client_id="${servicePrincipalId:-}"
                arm_client_secret="${servicePrincipalKey:-}"
                arm_tenant_id="${tenantId:-}"
                arm_oidc_token="${idToken:-}"

                if [ -z "${arm_client_id}" ] || [ -z "${arm_tenant_id}" ]; then
                  echo "Azure service connection credentials were not exposed to the script." >&2
                  echo "Use an Azure Resource Manager service connection and keep addSpnToEnvironment enabled." >&2
                  exit 1
                fi

                export ARM_CLIENT_ID="${arm_client_id}"
                export ARM_TENANT_ID="${arm_tenant_id}"

                if [ -n "${arm_client_secret}" ]; then
                  export ARM_CLIENT_SECRET="${arm_client_secret}"
                elif [ -n "${arm_oidc_token}" ]; then
                  export ARM_USE_OIDC=true
                  export ARM_OIDC_TOKEN="${arm_oidc_token}"
                else
                  echo "Azure service connection did not expose a client secret or OIDC token." >&2
                  exit 1
                fi

                backend_rg='${{ parameters.backendResourceGroupName }}'
                backend_storage_account='${{ parameters.backendStorageAccountName }}'
                backend_container='${{ parameters.backendContainerName }}'
                backend_key='${{ parameters.backendStateKey }}'
                state_subscription_id='${{ parameters.stateSubscriptionId }}'
                deployment_subscription_id='${{ parameters.deploymentSubscriptionId }}'

                az account set --subscription "${deployment_subscription_id}"

                cd "${{parameters.terraformWorkingDirectory}}"

                cat > backend.tf <<'EOF'
                terraform {
                  backend "azurerm" {}
                }
                EOF

                terraform init \
                  -backend-config="resource_group_name=${backend_rg}" \
                  -backend-config="storage_account_name=${backend_storage_account}" \
                  -backend-config="container_name=${backend_container}" \
                  -backend-config="key=${backend_key}" \
                  -backend-config="subscription_id=${state_subscription_id}" \
                  -backend-config="tenant_id=${ARM_TENANT_ID}" \
                  -backend-config="client_id=${ARM_CLIENT_ID}" \
                  -backend-config="use_azuread_auth=true"

          - bash: |
              set -euo pipefail

              cd "${{parameters.terraformWorkingDirectory}}"

              ls -la 
              ls ../ -la

              terraform validate
              
            displayName: Terraform validate

          - task: AzureCLI@2
            displayName: Terraform plan
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: 'true'
              inlineScript: |
                set -euo pipefail

                export TF_IN_AUTOMATION=true
                export TF_INPUT=false
                export ARM_SUBSCRIPTION_ID='${{ parameters.deploymentSubscriptionId }}'

                arm_client_id="${servicePrincipalId:-}"
                arm_client_secret="${servicePrincipalKey:-}"
                arm_tenant_id="${tenantId:-}"
                arm_oidc_token="${idToken:-}"

                if [ -z "${arm_client_id}" ] || [ -z "${arm_tenant_id}" ]; then
                  echo "Azure service connection credentials were not exposed to the script." >&2
                  echo "Use an Azure Resource Manager service connection and keep addSpnToEnvironment enabled." >&2
                  exit 1
                fi

                export ARM_CLIENT_ID="${arm_client_id}"
                export ARM_TENANT_ID="${arm_tenant_id}"

                if [ -n "${arm_client_secret}" ]; then
                  export ARM_CLIENT_SECRET="${arm_client_secret}"
                elif [ -n "${arm_oidc_token}" ]; then
                  export ARM_USE_OIDC=true
                  export ARM_OIDC_TOKEN="${arm_oidc_token}"
                else
                  echo "Azure service connection did not expose a client secret or OIDC token." >&2
                  exit 1
                fi

                deployment_subscription_id='${{ parameters.deploymentSubscriptionId }}'
                environment_name='${{ parameters.environmentName }}'
                terraform_common_var_file='${{ parameters.terraformCommonVarFile }}'
                terraform_var_file='${{ parameters.terraformVarFile }}'

                az account set --subscription "${deployment_subscription_id}"

                cd "${{parameters.terraformWorkingDirectory}}"

                export TF_VAR_environment="${environment_name}"

                plan_args=(-out=tfplan)

                if [ '${{ parameters.doDestroy }}' = "true" ]; then
                  plan_args=(-destroy -out=tfplan)
                fi

                if [ -n "${terraform_common_var_file}" ]; then
                  plan_args+=("-var-file=${terraform_common_var_file}")
                fi
                if [ -n "${terraform_var_file}" ]; then
                  plan_args+=("-var-file=${terraform_var_file}")
                fi

                terraform plan "${plan_args[@]}"

          - task: AzureCLI@2
            displayName: Terraform apply
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: 'true'
              inlineScript: |
                set -euo pipefail

                export TF_IN_AUTOMATION=true
                export TF_INPUT=false
                export ARM_SUBSCRIPTION_ID='${{ parameters.deploymentSubscriptionId }}'

                arm_client_id="${servicePrincipalId:-}"
                arm_client_secret="${servicePrincipalKey:-}"
                arm_tenant_id="${tenantId:-}"
                arm_oidc_token="${idToken:-}"

                if [ -z "${arm_client_id}" ] || [ -z "${arm_tenant_id}" ]; then
                  echo "Azure service connection credentials were not exposed to the script." >&2
                  echo "Use an Azure Resource Manager service connection and keep addSpnToEnvironment enabled." >&2
                  exit 1
                fi

                export ARM_CLIENT_ID="${arm_client_id}"
                export ARM_TENANT_ID="${arm_tenant_id}"

                if [ -n "${arm_client_secret}" ]; then
                  export ARM_CLIENT_SECRET="${arm_client_secret}"
                elif [ -n "${arm_oidc_token}" ]; then
                  export ARM_USE_OIDC=true
                  export ARM_OIDC_TOKEN="${arm_oidc_token}"
                else
                  echo "Azure service connection did not expose a client secret or OIDC token." >&2
                  exit 1
                fi

                deployment_subscription_id='${{ parameters.deploymentSubscriptionId }}'

                az account set --subscription "${deployment_subscription_id}"

                cd "${{parameters.terraformWorkingDirectory}}"

                terraform apply -auto-approve tfplan
