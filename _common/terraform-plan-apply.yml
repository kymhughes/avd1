parameters:
  stageName: ''
  displayName: ''
  dependsOn: ''
  runStage: true

  azureServiceConnection: ''
  deploymentSubscriptionId: ''
  stateSubscriptionId: ''
  backendResourceGroupName: ''
  backendStorageAccountName: ''
  backendContainerName: 'tfstate'
  backendStateKey: ''

  environmentName: ''
  terraformWorkingDirectory: ''
  terraformCommonVarFile: ''
  terraformVarFile: ''
  terraformVersion: '1.15.8'
  doDestroy: false

stages:
  - stage: ${{ parameters.stageName }}
    displayName: 'Deploy ${{ parameters.stageName }}'
    condition: and(succeeded(), eq('${{ parameters.runStage }}', 'true'))
    ${{ if ne(parameters.dependsOn, '') }}:
      dependsOn: ${{ parameters.dependsOn }}

    jobs:
      - job: Terraform
        displayName: ${{ parameters.environmentName }} doDestroy=${{ parameters.doDestroy }}
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail

              terraform_version='${{ parameters.terraformVersion }}'
              terraform_dir='$(Agent.TempDirectory)/terraform'
              mkdir -p "${terraform_dir}"

              curl -fsSL \
                "https://releases.hashicorp.com/terraform/${terraform_version}/terraform_${terraform_version}_linux_amd64.zip" \
                -o "$(Agent.TempDirectory)/terraform.zip"

              unzip -o -q "$(Agent.TempDirectory)/terraform.zip" -d "${terraform_dir}"
              echo "##vso[task.prependpath]${terraform_dir}"
              "${terraform_dir}/terraform" version

              echo "Adding routes due to clash of Devops pool address range"
              ip route get 172.17.10.6
              gateway="$(ip route show default | awk '{print $3; exit}')"
              sudo ip route replace 172.17.10.6/32 via "$gateway" dev eth0
              ip route get 172.17.100.246
              gateway="$(ip route show default | awk '{print $3; exit}')"
              sudo ip route replace 172.17.100.246/32 via "$gateway" dev eth0

            displayName: Install Terraform

          - bash: |
              set -euo pipefail
              cd "${{ parameters.terraformWorkingDirectory }}"
              terraform fmt -check -recursive
            displayName: Terraform fmt

          - task: AzureCLI@2
            displayName: Terraform init
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail

                export TF_IN_AUTOMATION=true
                export TF_INPUT=false
                export ARM_SUBSCRIPTION_ID='${{ parameters.deploymentSubscriptionId }}'

                export ARM_CLIENT_ID="${servicePrincipalId:-}"
                export ARM_CLIENT_SECRET="${servicePrincipalKey:-}"
                export ARM_TENANT_ID="${tenantId:-}"

                cd "${{ parameters.terraformWorkingDirectory }}"

                cat > backend.tf <<'EOF'
                terraform {
                  backend "azurerm" {}
                }
                EOF

                terraform init \
                  -backend-config="resource_group_name=${{ parameters.backendResourceGroupName }}" \
                  -backend-config="storage_account_name=${{ parameters.backendStorageAccountName }}" \
                  -backend-config="container_name=${{ parameters.backendContainerName }}" \
                  -backend-config="key=${{ parameters.backendStateKey }}" \
                  -backend-config="subscription_id=${{ parameters.stateSubscriptionId }}" \
                  -backend-config="tenant_id=${ARM_TENANT_ID}" \
                  -backend-config="client_id=${ARM_CLIENT_ID}" \
                  -backend-config="use_azuread_auth=true"

          - bash: |
              set -euo pipefail
              cd "${{ parameters.terraformWorkingDirectory }}"
              terraform validate
            displayName: Terraform validate

          - task: AzureCLI@2
            displayName: Terraform plan doDestroy=${{ parameters.doDestroy }}
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail

                export TF_IN_AUTOMATION=true
                export TF_INPUT=false
                export ARM_SUBSCRIPTION_ID='${{ parameters.deploymentSubscriptionId }}'
                export ARM_CLIENT_ID="${servicePrincipalId:-}"
                export ARM_CLIENT_SECRET="${servicePrincipalKey:-}"
                export ARM_TENANT_ID="${tenantId:-}"

                cd "${{ parameters.terraformWorkingDirectory }}"

                export TF_VAR_environment='${{ parameters.environmentName }}'

                plan_args=(-out=tfplan)

                if [ '${{ parameters.doDestroy }}' = "true" ] || [ '${{ parameters.doDestroy }}' = "True" ]; then
                  plan_args=(-destroy "${plan_args[@]}")
                fi

                if [ -n '${{ parameters.terraformCommonVarFile }}' ]; then
                  plan_args+=("-var-file=${{ parameters.terraformCommonVarFile }}")
                fi

                if [ -n '${{ parameters.terraformVarFile }}' ]; then
                  plan_args+=("-var-file=${{ parameters.terraformVarFile }}")
                fi

                terraform plan "${plan_args[@]}"

          - task: AzureCLI@2
            displayName: Terraform apply doDestroy=${{ parameters.doDestroy }}
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail

                export TF_IN_AUTOMATION=true
                export TF_INPUT=false
                export ARM_SUBSCRIPTION_ID='${{ parameters.deploymentSubscriptionId }}'
                export ARM_CLIENT_ID="${servicePrincipalId:-}"
                export ARM_CLIENT_SECRET="${servicePrincipalKey:-}"
                export ARM_TENANT_ID="${tenantId:-}"

                cd "${{ parameters.terraformWorkingDirectory }}"
                terraform apply -auto-approve tfplan
