trigger: none
# trigger:
#  branches:
#    include:
#      - main
#  paths:
#    include:
#      - 00-inplace-network/*

pool:
  name: devopspool1
  #name: Azure Pipelines

variables:
  tfFolder: 00-inplace-network

parameters:
  - name: doPause
    type: boolean
    default: false
  - name: doDestroy
    type: boolean
    default: false
    

  - name: environmentSection
    displayName: '──────── Select environments ────────'
    type: string
    default: 'Choose environments to run - will run in sequence'
    values:
      - 'Choose which environments to run'
  
  - name: deployNpd
    displayName: Deploy NPD
    type: boolean
    default: true

  - name: deployTst
    displayName: Deploy TST
    type: boolean
    default: false

  - name: deployPrd
    displayName: Deploy PRD
    type: boolean
    default: false

stages:
- ${{ if eq(parameters.deployNpd, true) }}:
  - stage: NPD
    displayName: NPD
    jobs:
    - template: ../_common/terraform-plan-apply.yml
      parameters:
        environmentName: npd
        terraformCommonVarFile: ../_environment/npd.tfvars
        terraformVarFile: npd.tfvars
        backendStateKey: npd-$(tfFolder).tfstate

- ${{ if eq(parameters.deployTst, true) }}:
  - stage: TST
    displayName: TST
    dependsOn: NPD
    jobs:
    - template: ../_common/terraform-plan-apply.yml
      parameters:
        environmentName: tst
        terraformCommonVarFile: ../_environment/tst.tfvars
        terraformVarFile: tst.tfvars
        backendStateKey: tst-$(tfFolder).tfstate

- ${{ if eq(parameters.deployPrd, true) }}:
  - stage: PRD
    displayName: PRD
    dependsOn: TST
    jobs:
    - template: ../_common/terraform-plan-apply.yml
      parameters:
        environmentName: prd
        terraformCommonVarFile: ../_environment/prd.tfvars
        terraformVarFile: prd.tfvars
        backendStateKey: prd-$(tfFolder).tfstate